name: Build installers

# Builds the two installers a release carries from the code in the repository, so
# anyone can check that what is published is what the code makes. The release
# itself is still created by hand from these files.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build both installers
        shell: pwsh
        run: ./installer/build.ps1 -OutDir out

      - uses: actions/upload-artifact@v4
        with:
          name: installers
          path: out/TaskbarGroupsFluent-Setup*.exe
          if-no-files-found: error
