<svg xmlns="http://www.w3.org/2000/svg" width="960" height="240" viewBox="0 0 960 240" role="img" aria-label="Pulsa Añadir grupo: Pulsa Añadir grupo, ponle nombre e icono, y añade apps con Aplicación, Carpeta o Grupo, o arrástralas desde el Explorador. Para que el panel enseñe una carpeta, elige Lo que hay en una carpeta y escoge una, o uno de los Lugares de Windows. Separador en el editor divide el panel en partes; para dejar espacio entre grupos en la barra, pulsa Separador junto a Ajustes. Elige cómo se ve el panel: Elige cómo se ve el panel en Panel y pulsa Guardar grupo. Pulsa Anclar a la barra de tareas: Pulsa Anclar a la barra de tareas: la app abre la carpeta con el acceso resaltado, y tú haces clic derecho en él y eliges *Anclar a la barra de tareas* (en Windows 11 está dentro de *Mostrar más opciones*). Windows no deja que las apps se anclen solas. Un grupo con grupos dentro te ofrece anclarlos todos, uno tras otro."><g transform="translate(134 8) scale(2.1667)"><g fill="none" stroke="#0a84ff" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M8 12h8m-4-4v8"/></g></g><text x="160" y="100" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="23" font-weight="600" fill="#f0f6fc">Pulsa Añadir grupo</text><text x="160" y="134" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="17" fill="#9198a1">Pulsa Añadir grupo, ponle nombre e</text><text x="160" y="159" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="17" fill="#9198a1">icono, y añade apps con</text><text x="160" y="184" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="17" fill="#9198a1">Aplicación, Carpeta o Grupo, o</text><text x="160" y="209" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="17" fill="#9198a1">arrástralas desde el Explorador.</text><path d="M206 34 H432" stroke="#3d444d" stroke-width="2" fill="none"/><path d="M425 28 L434 34 L425 40" stroke="#3d444d" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(454 8) scale(2.1667)"><g fill="none" stroke="#0a84ff" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9"><path d="M12 22a1 1 0 0 1 0-20a10 9 0 0 1 10 9a5 5 0 0 1-5 5h-2.25a1.75 1.75 0 0 0-1.4 2.8l.3.4a1.75 1.75 0 0 1-1.4 2.8z"/><circle cx="13.5" cy="6.5" r=".5" fill="#0a84ff"/><circle cx="17.5" cy="10.5" r=".5" fill="#0a84ff"/><circle cx="6.5" cy="12.5" r=".5" fill="#0a84ff"/><circle cx="8.5" cy="7.5" r=".5" fill="#0a84ff"/></g></g><text x="480" y="100" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="23" font-weight="600" fill="#f0f6fc">Elige cómo se ve el panel</text><text x="480" y="134" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="17" fill="#9198a1">Elige cómo se ve el panel en Panel</text><text x="480" y="159" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="17" fill="#9198a1">y pulsa Guardar grupo.</text><path d="M526 34 H752" stroke="#3d444d" stroke-width="2" fill="none"/><path d="M745 28 L754 34 L745 40" stroke="#3d444d" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(774 8) scale(2.1667)"><path fill="none" stroke="#0a84ff" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9" d="M12 17v5M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 