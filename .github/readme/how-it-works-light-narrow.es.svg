<svg xmlns="http://www.w3.org/2000/svg" width="520" height="483" viewBox="0 0 520 483" role="img" aria-label="Pulsa Añadir grupo: Pulsa Añadir grupo, ponle nombre e icono, y añade apps con Aplicación, Carpeta o Grupo, o arrástralas desde el Explorador. Para que el panel enseñe una carpeta, elige Lo que hay en una carpeta y escoge una, o uno de los Lugares de Windows. Separador en el editor divide el panel en partes; para dejar espacio entre grupos en la barra, pulsa Separador junto a Ajustes. Elige cómo se ve el panel: Elige cómo se ve el panel en Panel y pulsa Guardar grupo. Pulsa Anclar a la barra de tareas: Pulsa Anclar a la barra de tareas: la app abre la carpeta con el acceso resaltado, y tú haces clic derecho en él y eliges *Anclar a la barra de tareas* (en Windows 11 está dentro de *Mostrar más opciones*). Windows no deja que las apps se anclen solas. Un grupo con grupos dentro te ofrece anclarlos todos, uno tras otro."><g transform="translate(8 8) scale(2)"><g fill="none" stroke="#0a84ff" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M8 12h8m-4-4v8"/></g></g><text x="80" y="34" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="26" font-weight="600" fill="#1f2328">Pulsa Añadir grupo</text><text x="80" y="68" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="21" fill="#59636e">Pulsa Añadir grupo, ponle nombre e</text><text x="80" y="97" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="21" fill="#59636e">icono, y añade apps con Aplicación,</text><text x="80" y="126" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="21" fill="#59636e">Carpeta o Grupo, o arrástralas desde</text><text x="80" y="155" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="21" fill="#59636e">el Explorador.</text><path d="M32 68 V198" stroke="#d1d9e0" stroke-width="2" fill="none"/><path d="M26 190 L32 198 L38 190" stroke="#d1d9e0" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(8 210) scale(2)"><g fill="none" stroke="#0a84ff" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9"><path d="M12 22a1 1 0 0 1 0-20a10 9 0 0 1 10 9a5 5 0 0 1-5 5h-2.25a1.75 1.75 0 0 0-1.4 2.8l.3.4a1.75 1.75 0 0 1-1.4 2.8z"/><circle cx="13.5" cy="6.5" r=".5" fill="#0a84ff"/><circle cx="17.5" cy="10.5" r=".5" fill="#0a84ff"/><circle cx="6.5" cy="12.5" r=".5" fill="#0a84ff"/><circle cx="8.5" cy="7.5" r=".5" fill="#0a84ff"/></g></g><text x="80" y="236" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="26" font-weight="600" fill="#1f2328">Elige cómo se ve el panel</text><text x="80" y="270" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="21" fill="#59636e">Elige cómo se ve el panel en Panel y</text><text x="80" y="299" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="21" fill="#59636e">pulsa Guardar grupo.</text><path d="M32 270 V342" stroke="#d1d9e0" stroke-width="2" fill="none"/><path d="M26 334 L32 342 L38 334" stroke="#d1d9e0" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(8 354) scale(2)"><path fill="none" stroke="#0a84ff" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9" d="M12 17v5M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4a1 1 0 0 1 1 1z"/></g><text x="80" y="380" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="26" font-weight="600" fill="#1f2328">Pulsa Anclar a la barra de</text><text x="80" y="414" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="26" font-weight="600" fill="#1f2328">tareas</text><text x="80" y="448" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="21" fill="#59636e">Pulsa Anclar a la barra de tareas.</text></svg>