<svg xmlns="http://www.w3.org/2000/svg" width="520" height="449" viewBox="0 0 520 449" role="img" aria-label="Click Add group: Click Add group, give it a name and an icon, and add apps with App, Folder or Group, or drag them in from File Explorer. To have the panel show a folder instead, pick What is in a folder and choose one, or one of the Windows places. Separator in the editor splits the panel into sections; to space groups out on the taskbar, click Separator beside Settings. Pick the panel's look: Pick the panel's look under Panel and click Save group. Click Pin to taskbar: Click Pin to taskbar: the app opens the folder with the shortcut highlighted, and you right-click it and choose *Pin to taskbar* (on Windows 11 it is under *Show more options*). Windows doesn't let apps pin themselves. A group with groups inside offers to pin them all, one after another."><g transform="translate(8 8) scale(2)"><g fill="none" stroke="#0a84ff" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M8 12h8m-4-4v8"/></g></g><text x="80" y="34" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="26" font-weight="600" fill="#f0f6fc">Click Add group</text><text x="80" y="68" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="21" fill="#9198a1">Click Add group, give it a name and</text><text x="80" y="97" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="21" fill="#9198a1">an icon, and add apps with App,</text><text x="80" y="126" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="21" fill="#9198a1">Folder or Group, or drag them in</text><text x="80" y="155" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="21" fill="#9198a1">from File Explorer.</text><path d="M32 68 V198" stroke="#3d444d" stroke-width="2" fill="none"/><path d="M26 190 L32 198 L38 190" stroke="#3d444d" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(8 210) scale(2)"><g fill="none" stroke="#0a84ff" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9"><path d="M12 22a1 1 0 0 1 0-20a10 9 0 0 1 10 9a5 5 0 0 1-5 5h-2.25a1.75 1.75 0 0 0-1.4 2.8l.3.4a1.75 1.75 0 0 1-1.4 2.8z"/><circle cx="13.5" cy="6.5" r=".5" fill="#0a84ff"/><circle cx="17.5" cy="10.5" r=".5" fill="#0a84ff"/><circle cx="6.5" cy="12.5" r=".5" fill="#0a84ff"/><circle cx="8.5" cy="7.5" r=".5" fill="#0a84ff"/></g></g><text x="80" y="236" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="26" font-weight="600" fill="#f0f6fc">Pick the panel's look</text><text x="80" y="270" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="21" fill="#9198a1">Pick the panel's look under Panel</text><text x="80" y="299" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="21" fill="#9198a1">and click Save group.</text><path d="M32 270 V342" stroke="#3d444d" stroke-width="2" fill="none"/><path d="M26 334 L32 342 L38 334" stroke="#3d444d" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(8 354) scale(2)"><path fill="none" stroke="#0a84ff" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9" d="M12 17v5M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4a1 1 0 0 1 1 1z"/></g><text x="80" y="380" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="26" font-weight="600" fill="#f0f6fc">Click Pin to taskbar</text><text x="80" y="414" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="21" fill="#9198a1">Click Pin to taskbar.</text></svg>