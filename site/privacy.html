<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Privacy · Taskbar Groups Fluent</title>
<!-- La dirección vieja de la privacidad, la que enlaza la ficha de la Microsoft Store
     (docs/store/listing.md): no se puede romper. Ahora la política vive en /privacidad/ y
     /en/privacy/; esta solo lleva a la suya. Como antes, va a la del idioma elegido en la web o,
     si no hay ninguno, a la del navegador; sin JavaScript, a la inglesa, que es la de la ficha. -->
<link rel="canonical" href="https://tbgf.munito.dev/en/privacy/">
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="0; url=en/privacy/">
<script>
(function () {
  var es = false;
  try {
    var elegido = localStorage.getItem("tbgf-lang");
    es = elegido ? elegido === "es" : /^es\b/i.test((navigator.languages && navigator.languages[0]) || navigator.language || "");
  } catch (e) {}
  location.replace(es ? "privacidad/" : "en/privacy/");
})();
</script>
</head>
<body>
<p><a href="en/privacy/">Privacy policy</a> · <a href="privacidad/" lang="es">Política de privacidad</a></p>
</body>
</html>
